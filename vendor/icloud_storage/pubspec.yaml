name: icloud_storage
description: A flutter plugin for upload, download and manage files in the app's iCloud container. (vendored copy with Dart 3 compatible SDK bound)
version: 1.0.0

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: IcloudStoragePlugin

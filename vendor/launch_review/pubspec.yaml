name: launch_review
description: A flutter plugin to launch review dialog or write review on Google Play / App Store. (vendored copy with Dart 3 compatible SDK bound)
version: 3.0.1

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.iyaffle.launchreview
        pluginClass: LaunchReviewPlugin
      ios:
        pluginClass: LaunchReviewPlugin

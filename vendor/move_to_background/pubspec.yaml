name: move_to_background
description: Flutter plugin for sending application to background. Send your app to the background with one line of code. (vendored copy with Dart 3 compatible SDK bound)
version: 1.0.2

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.10.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.sayegh.move_to_background
        pluginClass: MoveToBackgroundPlugin
      ios:
        pluginClass: MoveToBackgroundPlugin
